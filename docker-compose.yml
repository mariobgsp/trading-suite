# ─────────────────────────────────────────────────────────────────────────────
# Trading Suite — one box, two containers: the API and the static app behind it.
#
#   DOMAIN=desk.example.com STUDY_DIR=/srv/trading-backtest-docs \
#     docker compose up -d --build
#
# Caddy terminates TLS and proxies /api to the backend, so the browser (and the
# Android app) talk to one origin and CORS never enters the picture.
#
# The study checkout is a hard dependency of the API: mount it read-only. The
# cache volume keeps the SQLite store across rebuilds.
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ./backend
    container_name: trading-suite-backend
    environment:
      - TRADING_DOCS_DIR=/study
      - YFINANCE_CACHE_TTL=${YFINANCE_CACHE_TTL:-3600}
      - YFINANCE_HISTORY_CACHE_TTL=${YFINANCE_HISTORY_CACHE_TTL:-43200}
      - FOREX_CACHE_TTL=${FOREX_CACHE_TTL:-3600}
    volumes:
      - trading_suite_data:/app/data
      - ${STUDY_DIR:-../trading-backtest-docs}:/study:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    container_name: trading-suite-web
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./frontend-native:/srv:ro
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  trading_suite_data:
  caddy_data:
  caddy_config:
