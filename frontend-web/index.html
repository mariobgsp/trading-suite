<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Suite</title>
    <meta
      name="description"
      content="Market screening, portfolio profiling and trade planning for IDX equities."
    />
    <!-- Theme boot: applies the stored choice (or the OS default) as a class
         on <html> before first paint, so there is no white flash before React
         mounts. index.html is the only place that can run before hydration;
         src/lib/theme.ts owns everything after this. Keep THEME_KEY and the
         system-dark query in sync with it. -->
    <style>
      html { background: #ffffff; }
      html.dark { background: #121110; }
    </style>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("ts-theme");
          if (pref !== "light" && pref !== "dark") pref = "auto";
          var dark =
            pref === "dark" ||
            (pref === "auto" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode / storage disabled: fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
