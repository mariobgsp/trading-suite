[project]
name = "trading-suite-backend"
version = "0.1.0"
description = "Consolidated FastAPI backend for the merged IDX trading platform"
requires-python = ">=3.11"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["app", "core", "config", "tests"]
exclude = ["data", "logs", ".venv"]
ignore = ["app/services", "core", "config"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
line-length = 100
target-version = "py311"
